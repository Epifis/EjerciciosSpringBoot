# ===============================
# Configuración Docker
# ===============================

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/bank_db
spring.datasource.username=bank_user
spring.datasource.password=bank_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.db.enabled=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.com.bank=DEBUG
logging.level.org.springframework.web=INFO
logging.file.name=/app/logs/bank-app.log

# Info Endpoint
info.app.name=Sistema Bancario Dockerizado
info.app.version=1.0.0
info.app.description=Demo de Actuator con PostgreSQL en Docker
info.app.environment=docker